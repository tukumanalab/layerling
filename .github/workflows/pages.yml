name: GitHub Pages

# Publishes the static export to GitHub Pages on every push to tukumana (this fork's own branch; main mirrors upstream). The site is served from the
# folder Pages gives the repository (https://<owner>.github.io/<repository>/), so the export is
# built with that folder as its base path; a custom domain or an <owner>.github.io repository
# gives an empty one and the files are requested from the root, as on any other web server.
#
# Pages has to be set to "GitHub Actions" as its source once, under Settings > Pages.

on:
  push:
    branches: [tukumana]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Static export
        run: npm run export
        env:
          LAYERLING_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload the export
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/.next-export

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
